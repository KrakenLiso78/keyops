openapi: 3.1.0
info:
  title: KeyOps Access API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /sessions:
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCommand"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /session:
    get:
      operationId: restoreSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current enabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Controlled error without sensitive data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SignInCommand:
      type: object
      additionalProperties: false
      required: [loginIdentifier, password]
      properties:
        loginIdentifier:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    Permission:
      type: string
      enum:
        - applications:read
        - credentials:issue
        - credentials:regenerate
        - credentials:deliver
        - credentials:suspend
        - credentials:reactivate
        - credentials:revoke
        - management:write
        - usage:read
        - audit:read
        - users:write
    User:
      type: object
      additionalProperties: false
      required:
        [id, loginIdentifier, displayName, profile, enabled, permissions]
      properties:
        id: { type: string }
        loginIdentifier: { type: string }
        displayName: { type: string }
        profile:
          type: string
          enum: [analyst, senior_analyst, administrator, auditor]
        enabled: { type: boolean }
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
