openapi: 3.1.0
info:
  title: KeyOps Corporate Catalog Provider Capability
  version: 1.0.0
servers:
  - url: https://catalog-provider.example.invalid
paths:
  /applications:
    get:
      operationId: listCorporateApplications
      parameters:
        - $ref: '#/components/parameters/Environment'
        - { name: query, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Authorized catalog page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /applications/{externalApplicationId}:
    get:
      operationId: getCorporateApplication
      parameters:
        - name: externalApplicationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Current corporate application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogApplication' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Environment:
      name: environment
      in: query
      required: true
      schema: { type: string, enum: [test, production] }
  responses:
    Error:
      description: Provider error translated by the adapter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CatalogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogApplication' } }
        nextCursor: { type: string }
    CatalogApplication:
      type: object
      additionalProperties: false
      required: [externalApplicationId, name, externalInstitutionId, institutionName, externalRoleId, roleName, environment, active, recordVersion, updatedAt]
      properties:
        externalApplicationId: { type: string }
        name: { type: string }
        externalInstitutionId: { type: string }
        institutionName: { type: string }
        externalRoleId: { type: string }
        roleName: { type: string }
        environment: { type: string, enum: [test, production] }
        active: { type: boolean }
        recordVersion: { type: string }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }

